{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CREATE ACCOUNT | AI CCTV</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary: #38bdf8;
            --primary-hover: #0ea5e9;
            --bg-dark: #020617;
            --text-dim: #94a3b8;
            --danger: #ef4444;
        }

        * {
            margin: 0; padding: 0; box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(rgba(2, 6, 23, 0.85), rgba(2, 6, 23, 0.95)),
                        url("{% static 'images/cctv_front.jpg' %}");
            background-size: cover;
            background-position: center;
            overflow: hidden;
        }

        /* --- SIGNUP CARD --- */
        .signup-card {
            width: 100%;
            max-width: 440px;
            padding: 40px;
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            backdrop-filter: blur(20px);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            text-align: center;
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- HEADER --- */
        .brand {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            text-decoration: none;
        }

        .brand i { color: var(--primary); font-size: 1.8rem; }
        .brand h2 {
            font-family: 'Poppins', sans-serif;
            color: #fff;
            letter-spacing: 1px;
            font-size: 1.5rem;
        }

        .signup-card p {
            color: var(--text-dim);
            font-size: 0.85rem;
            margin-bottom: 25px;
        }

        /* --- FORM INPUTS --- */
        .input-group {
            margin-bottom: 18px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-dim);
            margin-bottom: 6px;
            padding-left: 4px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper i {
            position: absolute;
            left: 15px;
            color: #475569;
            font-size: 1rem;
        }

        .input-wrapper input {
            width: 100%;
            padding: 12px 12px 12px 42px;
            background: rgba(2, 6, 23, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: white;
            font-size: 0.95rem;
            transition: 0.3s;
            outline: none;
        }

        .input-wrapper input:focus {
            border-color: var(--primary);
            background: rgba(2, 6, 23, 0.8);
            box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.1);
        }

        /* --- BUTTON --- */
        .btn-signup {
            width: 100%;
            padding: 14px;
            margin-top: 10px;
            background: var(--primary);
            color: #020617;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .btn-signup:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(56, 189, 248, 0.3);
        }

        /* --- FOOTER LINK --- */
        .login-link {
            margin-top: 25px;
            font-size: 0.85rem;
            color: var(--text-dim);
        }

        .login-link a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }

        .login-link a:hover { text-decoration: underline; }

        /* Django Error Style */
        .errorlist {
            color: var(--danger);
            list-style: none;
            font-size: 0.8rem;
            margin-bottom: 10px;
            text-align: left;
        }
    </style>
</head>

<body>

    <div class="signup-card">
        <a href="/" class="brand">
            <i class="fas fa-user-plus"></i>
            <h2>JOIN AI CCTV</h2>
        </a>
        <p>Register to manage AI monitoring nodes.</p>

        <form method="POST">
            {% csrf_token %}

            <div class="input-group">
                <label>Username</label>
                <div class="input-wrapper">
                    <i class="fas fa-user"></i>
                    <input type="text" name="username" placeholder="Choose a unique ID" required>
                </div>
            </div>

            <div class="input-group">
                <label>Email Address</label>
                <div class="input-wrapper">
                    <i class="fas fa-envelope"></i>
                    <input type="email" name="email" placeholder="admin@enterprise.com" required>
                </div>
            </div>

            <div class="input-group">
                <label>Password</label>
                <div class="input-wrapper">
                    <i class="fas fa-lock"></i>
                    <input type="password" name="password" placeholder="Create strong password" required>
                </div>
            </div>

            <div class="input-group">
                <label>Confirm Password</label>
                <div class="input-wrapper">
                    <i class="fas fa-shield-alt"></i>
                    <input type="password" name="confirm_password" placeholder="Repeat password" required>
                </div>
            </div>

            <button type="submit" class="btn-signup">
                Create Account <i class="fas fa-chevron-right"></i>
            </button>

            <div class="login-link">
                System operator already? <a href="{% url 'login' %}">Login here</a>
            </div>
        </form>
    </div>

</body>
</html>
